<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dağıtım Verisi Yönetimi</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:Arial,sans-serif}
.wrap{max-width:720px;margin:40px auto;padding:16px}.card{background:#fff;border:1px solid #e1e7ef;border-radius:18px;padding:24px;box-shadow:0 8px 30px #18243a12}
h1{margin:0 0 8px;font-size:28px}p{color:#68758a}label{display:block;font-weight:700;margin:16px 0 6px}
input,button{width:100%;min-height:48px;border-radius:11px;font-size:16px}input{border:1px solid #d6deea;padding:10px 12px}
button{border:0;background:#5b43f2;color:#fff;font-weight:800;margin-top:14px;cursor:pointer}button:disabled{opacity:.5}
.status{margin-top:16px;padding:12px;border-radius:11px;background:#eef4ff;line-height:1.5}.ok{background:#eafaf3;color:#087c52}.err{background:#fff0f0;color:#a61b1b}
progress{width:100%;height:18px;margin-top:12px}
.small{font-size:12px;color:#718096;margin-top:8px}

.tabs{display:flex;gap:8px;margin:18px 0 8px}.tabs button{margin:0;background:#eef1f7;color:#263247}.tabs button.active{background:#5b43f2;color:#fff}
.panel{display:none}.panel.active{display:block}.req{border:1px solid #e1e7ef;border-radius:12px;padding:13px;margin-top:10px;background:#fff}
.reqtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.badge{font-size:12px;font-weight:800;padding:5px 8px;border-radius:999px;background:#eef4ff}
.reqmeta{font-size:12px;color:#68758a;line-height:1.6;margin-top:6px}.reqmsg{margin-top:9px;white-space:pre-wrap;line-height:1.45}
.req select{width:100%;min-height:40px;border:1px solid #d6deea;border-radius:9px;padding:6px;margin-top:10px;background:#fff}
</style></head><body><div class="wrap"><div class="card">
<h1>Dağıtım Yönetimi</h1><p>Bu ekran yalnızca yetkili kullanım içindir.</p>
<div class="tabs"><button id="tabData" class="active" type="button">Dağıtım Verisi</button><button id="tabReq" type="button">Öneri / Talepler</button></div>
<div id="dataPanel" class="panel active">
<label>Admin şifresi</label><input id="pw" type="password" autocomplete="current-password">
<label>Excel / CSV dosyası</label><input id="file" type="file" accept=".xlsx,.xls,.csv">
<button id="upload">Veriyi Güncelle</button>
<progress id="prog" value="0" max="100" style="display:none"></progress>
<div id="status" class="status">Dosya seçip şifrenizi girdikten sonra güncellemeyi başlatın.</div>
<div class="small">Beklenen sütunlar: İl, İlçe, Mahalle, PZT, SAL, CRS, PRS, CUM, CTS, PZR.</div>
</div>
<div id="reqPanel" class="panel">
  <label>Admin şifresi</label><input id="reqPw" type="password" autocomplete="current-password">
  <button id="loadReq" type="button">Öneri / Talepleri Getir</button>
  <div id="reqStatus" class="status">Şifrenizi girip talepleri getirin.</div>
  <div id="reqList"></div>
</div>
</div></div>
<script>
const API="https://dagitimveri.egemenduman.workers.dev";
const norm=s=>String(s??'').trim().toLocaleLowerCase('tr-TR').replace(/ı/g,'i').replace(/ş/g,'s').replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ö/g,'o').replace(/ç/g,'c').replace(/[^a-z0-9]+/g,' ').trim();
const dayOpen=v=>{const x=norm(v);return ['1','evet','e','var','acik','aktif','x','yes','true'].includes(x)||Number(v)===1?1:0};
function parseRows(rows){
 if(!rows||rows.length<2)throw new Error('Excel boş veya başlık satırı bulunamadı.');
 const h=rows[0].map(x=>norm(x)); const find=a=>h.findIndex(x=>a.includes(x));
 const ci=find(['il']),cj=find(['ilce']),cm=find(['mahalle','mahalle koy','mahallekoy']);
 const dayAlts=[['pzt','pazartesi'],['sal','sali'],['crs','carsamba'],['prs','persembe'],['cum','cuma'],['cts','cumartesi'],['pzr','pazar']];
 const di=dayAlts.map(find);
 if(ci<0||cj<0||cm<0||di.some(x=>x<0))throw new Error('Beklenen sütunlar bulunamadı.');
 const out=[];
 for(let n=1;n<rows.length;n++){const r=rows[n],il=String(r[ci]??'').trim(),ilce=String(r[cj]??'').trim(),mah=String(r[cm]??'').trim();if(il&&ilce&&mah)out.push([il,ilce,mah,di.map(i=>dayOpen(r[i]))]);}
 if(!out.length)throw new Error('Geçerli veri satırı bulunamadı.'); return out;
}
async function call(path,pw,body){
 const r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Password':pw},body:body?JSON.stringify(body):undefined});
 const j=await r.json().catch(()=>({})); if(!r.ok)throw new Error(j.error||('HTTP '+r.status)); return j;
}
const st=(m,c='')=>{const x=document.getElementById('status');x.className='status '+c;x.textContent=m};
document.getElementById('upload').onclick=async()=>{
 const btn=document.getElementById('upload'),pw=document.getElementById('pw').value,file=document.getElementById('file').files[0],prog=document.getElementById('prog');
 if(!pw)return st('Admin şifresini girin.','err'); if(!file)return st('Excel veya CSV dosyası seçin.','err');
 btn.disabled=true; prog.style.display='block'; prog.value=0;
 try{
   st('Dosya okunuyor…');
   let rows;
   if(file.name.toLowerCase().endsWith('.csv')){const t=await file.text();const wb=XLSX.read(t,{type:'string'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''})}
   else{const b=await file.arrayBuffer();const wb=XLSX.read(b,{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''})}
   const data=parseRows(rows); st(data.length.toLocaleString('tr-TR')+' kayıt hazırlandı. Yetki kontrol ediliyor…');
   await call('/admin/check',pw); await call('/admin/start',pw);
   const size=200;
   for(let i=0;i<data.length;i+=size){
     await call('/admin/chunk',pw,{rows:data.slice(i,i+size)});
     prog.value=Math.round(Math.min(99,(i+size)/data.length*100));
     st('Yükleniyor… '+Math.min(i+size,data.length).toLocaleString('tr-TR')+' / '+data.length.toLocaleString('tr-TR'));
   }
   const done=await call('/admin/finish',pw); prog.value=100;
   st('Güncelleme tamamlandı • '+done.count.toLocaleString('tr-TR')+' kayıt • '+new Date(done.updated).toLocaleString('tr-TR'),'ok');
 }catch(e){st('Güncelleme başarısız: '+e.message,'err')}
 finally{btn.disabled=false}
};
</script>
<script>
(()=>{
 const td=document.getElementById('tabData'),tr=document.getElementById('tabReq'),dp=document.getElementById('dataPanel'),rp=document.getElementById('reqPanel');
 function tab(which){const req=which==='req';td.classList.toggle('active',!req);tr.classList.toggle('active',req);dp.classList.toggle('active',!req);rp.classList.toggle('active',req)}
 td.onclick=()=>tab('data');tr.onclick=()=>tab('req');
 const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 async function getReq(){
   const pw=document.getElementById('reqPw').value,st=document.getElementById('reqStatus'),list=document.getElementById('reqList');
   st.textContent='Yükleniyor…';list.innerHTML='';
   try{
     const r=await fetch(API+'/admin/oneriler',{headers:{'X-Admin-Password':pw}});
     const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
     const rows=j.rows||[];st.textContent=rows.length?rows.length+' kayıt bulundu.':'Henüz öneri / talep yok.';
     list.innerHTML=rows.map(x=>`<div class="req">
       <div class="reqtop"><b>${esc(x.ad_soyad)}</b><span class="badge">${esc(x.durum)}</span></div>
       <div class="reqmeta">${esc(x.gsm)} • ${esc(x.email)}<br>${esc(new Date(x.tarih).toLocaleString('tr-TR'))}</div>
       <div class="reqmsg">${esc(x.aciklama)}</div>
       <select data-id="${x.id}">
         ${['Yeni','İnceleniyor','Tamamlandı'].map(d=>`<option ${d===x.durum?'selected':''}>${d}</option>`).join('')}
       </select>
     </div>`).join('');
     list.querySelectorAll('select[data-id]').forEach(sel=>sel.onchange=async()=>{
       const rr=await fetch(API+'/admin/oneri-durum',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Password':pw},body:JSON.stringify({id:Number(sel.dataset.id),durum:sel.value})});
       const jj=await rr.json().catch(()=>({}));if(!rr.ok){alert(jj.error||'Durum güncellenemedi');return}getReq();
     });
   }catch(e){st.textContent='Hata: '+e.message;}
 }
 document.getElementById('loadReq').onclick=getReq;
})();
</script>
</body></html>
