:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#687386;--accent:#5b4cf0;--ok:#087f5b;--line:#e5e9f2}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}.wrap{max-width:980px;margin:42px auto;padding:0 18px}.hero{margin-bottom:18px}.hero h1{font-size:32px;margin:0 0 8px}.hero p{color:var(--muted);margin:0}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 10px 30px #1720330d}.grid{display:grid;grid-template-columns:1fr 190px 130px;gap:12px}.filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 0 6px}.field select{width:100%;font:inherit;border-radius:12px;border:1px solid #ccd3df;padding:12px 14px;background:#fff;color:var(--ink)}.searchwrap{position:relative}.suggestions{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 35px #17203322;max-height:330px;overflow:auto;display:none}.suggestion{padding:11px 13px;cursor:pointer;border-bottom:1px solid #f0f2f6}.suggestion:last-child{border-bottom:0}.suggestion:hover,.suggestion.active{background:#f5f4ff}.suggestion b{display:block;font-size:14px}.suggestion span{font-size:12px;color:var(--muted)}input,select,button{font:inherit;border-radius:12px;border:1px solid #ccd3df;padding:13px 14px}input:focus{outline:2px solid #5b4cf033;border-color:var(--accent)}button{background:var(--accent);color:white;border:0;font-weight:700;cursor:pointer}.hint{font-size:13px;color:var(--muted);margin-top:10px}.results{margin-top:18px}.result{border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:10px;cursor:pointer}.result:hover{border-color:#b7b0ff}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.place{font-weight:750;font-size:17px}.badge{white-space:nowrap;background:#e8fff6;color:var(--ok);font-weight:800;padding:7px 10px;border-radius:999px}.closed{background:#fff2f2;color:#b42318}.days{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.day{font-size:12px;padding:5px 8px;border-radius:8px;background:#f0f2f6;color:#8a94a6}.day.on{background:#e8fff6;color:#087f5b;font-weight:700}.empty{text-align:center;color:var(--muted);padding:30px 10px}.small{font-size:12px;color:var(--muted);margin-top:8px}.dataBar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px;padding:12px 14px;background:#f8f9fc;border:1px solid var(--line);border-radius:12px}.dataBar button{padding:9px 12px}.dataInfo{font-size:12px;color:var(--muted);flex:1}.importBtn{background:#172033}.statusOk{color:var(--ok);font-weight:700}.statusErr{color:#b42318;font-weight:700}@media(max-width:700px){

</head><body><div class="wrap"><div class="hero"><h1>Dağıtım Günü Sorgulama</h1><p>Mahalle veya adres yazın; seçtiğiniz tarihten itibaren ilk dağıtım gününü görün.</p></div><div class="card"><div class="grid"><div class="searchwrap"><input id="q" style="width:100%" autocomplete="off" autocapitalize="words" enterkeyhint="search" placeholder="Mahalle veya açık adres yazın"><div id="suggestions" class="suggestions"></div></div><input id="date" type="date"><button id="btn">Sorgula</button></div><div class="hint">En az 3 karakter yazdığınızda mahalle önerileri görünür. Açık adresi doğrudan yapıştırabilir veya aşağıdaki İl / İlçe / Mahalle filtrelerini kullanabilirsiniz.</div><div class="dataBar"><div id="dataInfo" class="dataInfo">Merkezi veri yükleniyor…</div></div><div class="filters"><div class="field"><label>İl</label><select id="il"><option value="">Tüm iller</option></select></div><div class="field"><label>İlçe</label><select id="ilce" disabled><option value="">Tüm ilçeler</option></select></div><div class="field"><label>Mahalle / Köy</label><select id="mah" disabled><option value="">Tüm mahalleler</option></select></div></div><div id="results" class="results"></div><div id="opsBox" class="opsBox" style="display:none"></div><div id="weatherBox" class="weatherBox" style="display:none"></div></div></div><script>


const MGM_BASE='https://servis.mgm.gov.tr/web';
const MGM_PAGE='https://www.mgm.gov.tr/tahmin/il-ve-ilceler.aspx';
let weatherRequestNo=0;
function weatherEsc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function mgmSlug(v){return String(v||'').toLocaleLowerCase('tr-TR').replace(/ı/g,'i').replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ş/g,'s').replace(/ö/g,'o').replace(/ç/g,'c').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function weatherFallback(box,il,ilce,msg){
 box.style.display='block';
 box.innerHTML='<div class="weatherPanel"><div class="weatherTitle">5 Günlük Hava Tahmini</div><div class="weatherSub">'+weatherEsc(ilce+' / '+il)+'</div><div class="weatherFallback">'+weatherEsc(msg)+' <a target="_blank" rel="noopener noreferrer" href="'+MGM_PAGE+'?m='+encodeURIComponent(il)+'&ilce='+encodeURIComponent(ilce)+'">MGM tahminlerini aç ↗</a></div></div>';
}
async function loadWeather(il,ilce){
 const box=document.getElementById('weatherBox'); if(!box||!il||!ilce)return;
 const req=++weatherRequestNo; box.style.display='block';
 box.innerHTML='<div class="weatherPanel"><div class="weatherTitle">5 Günlük Hava Tahmini</div><div class="weatherSub">'+weatherEsc(ilce+' / '+il)+' • MGM verisi yükleniyor…</div></div>';
 try{
  const wr=await fetch('https://dagitimuyari.egemenduman.workers.dev/weather?il='+encodeURIComponent(il)+'&ilce='+encodeURIComponent(ilce),{cache:'no-store'});
  if(!wr.ok)throw new Error('Hava servisi HTTP '+wr.status);
  const data=await wr.json(); if(req!==weatherRequestNo)return;
  let rows=Array.isArray(data.rows)?data.rows:[];
  if(!rows.length)throw new Error(data.error||'Tahmin bulunamadı');

  const val=(o,keys)=>{for(const k of keys)if(o&&o[k]!==undefined&&o[k]!==null)return o[k];return '—'};
  const WEATHER_NAMES={
    'A':'Açık','AB':'Az Bulutlu','PB':'Parçalı Bulutlu','CB':'Çok Bulutlu',
    'HY':'Hafif Yağmurlu','Y':'Yağmurlu','KY':'Kuvvetli Yağmurlu',
    'HSY':'Hafif Sağanak Yağışlı','SY':'Sağanak Yağışlı','KSY':'Kuvvetli Sağanak Yağışlı',
    'GSY':'Gök Gürültülü Sağanak Yağışlı','KGY':'Kuvvetli Gök Gürültülü Sağanak Yağışlı',
    'HKY':'Hafif Kar Yağışlı','K':'Kar Yağışlı','KKY':'Kuvvetli Kar Yağışlı',
    'SIS':'Sisli','PUS':'Puslu','R':'Rüzgarlı'
  };
  const weatherName=c=>WEATHER_NAMES[String(c||'').toUpperCase()]||String(c||'—');
  const risky=c=>/GSY|KGY|KSY|KY|KKY|K$|SY|Y$/.test(String(c||'').toUpperCase());

  const cur=data.current && !data.current.error ? data.current : null;
  let todayCard='';
  if(cur){
    const cc=val(cur,['hadise','hadiseKodu','weather']);
    const ccode=String(cc||'').replace(/[^A-Za-z0-9_-]/g,'');
    const cicon=ccode&&ccode!=='—'?'<img class="weatherTodayIcon" alt="" src="https://www.mgm.gov.tr/Images_Sys/hadiseler/'+encodeURIComponent(ccode)+'.svg">':'';
    const temp=val(cur,['sicaklik','temperature']);
    const nem=val(cur,['nem','humidity']);
    const rh=val(cur,['ruzgarHiz','ruzgarHizi']);
    const ry=val(cur,['ruzgarYon','ruzgarYonu']);
    const obs=String(val(cur,['tarih','veriZamani','date'])).replace('T',' ').replace('Z','');
    const obsLabel=cur.isForecast?'MGM saatlik tahmini':'Son ölçüm';
    todayCard='<div class="weatherToday"><div class="weatherTodayHead">'+cicon+'<div><div class="weatherTodayTitle">Bugün • '+weatherEsc(weatherName(cc))+'</div><div class="weatherTodayDesc">'+weatherEsc(ilce+' / '+il)+(obs&&obs!=='—'?' • '+weatherEsc(obsLabel)+': '+weatherEsc(obs):'')+'</div></div></div><div class="weatherTodayGrid"><div class="weatherMetric"><span>Sıcaklık</span><b>'+weatherEsc(temp)+' °C</b></div><div class="weatherMetric"><span>Nem</span><b>%'+weatherEsc(nem)+'</b></div><div class="weatherMetric"><span>Rüzgâr</span><b>'+weatherEsc(rh)+' km/sa</b></div><div class="weatherMetric"><span>Rüzgâr yönü</span><b>'+weatherEsc(ry)+'°</b></div></div></div>';
    if(risky(cc)){
      todayCard+='<div class="weatherNotice weatherRisk"><strong>⚠ Bugün için hava durumu uyarısı – '+weatherEsc(ilce+' / '+il)+'</strong>'+weatherEsc(weatherName(cc))+' koşulları kurye saha operasyonunu etkileyebilir.</div>';
    }
  }else{
    todayCard='<div class="weatherNotice"><strong>Bugünün hava durumu</strong>Anlık MGM ölçümü alınamadı; aşağıdaki 5 günlük tahmin gösteriliyor.</div>';
  }

  // MGM daily forecast starts with tomorrow. For the user-selected date, if it is
  // before the first MGM row, explain that clearly instead of pretending it is missing.
  const selected=document.getElementById('date')?.value || document.querySelector('input[type="date"]')?.value || '';
  const firstDate=String(val(rows[0],['tarih','date'])).slice(0,10);
  let notice='';
  if(selected && firstDate && selected < firstDate){
    notice='';
  }

  // Warning for the queried location based on the forecast conditions returned by MGM.
  const alerts=rows.filter(r=>risky(val(r,['hadise','hadiseKodu','weather']))).map(r=>{
    const dt=String(val(r,['tarih','date'])).slice(0,10);
    const code=val(r,['hadise','hadiseKodu','weather']);
    return weatherEsc(dt.split('-').reverse().join('.')+' – '+weatherName(code));
  });
  if(alerts.length){
    notice+='<div class="weatherNotice weatherRisk"><strong>⚠ Hava durumu uyarısı – '+weatherEsc(ilce+' / '+il)+'</strong>'+alerts.join('<br>')+'</div>';
  }

  const body=rows.slice(0,5).map((r,i)=>{
    const n=i+1;
    const rawDate=String(val(r,['tarih','date','tarihGun'+n]));
    const dt=rawDate.slice(0,10);
    const dateText=/^\d{4}-\d{2}-\d{2}$/.test(dt)?dt.split('-').reverse().join('.'):rawDate;
    const had=val(r,['hadise','hadiseKodu','weather','hadiseGun'+n,'hadise'+n]);
    const min=val(r,['enDusukGun'+n,'enDusuk','minSicaklik','min']);
    const max=val(r,['enYuksekGun'+n,'enYuksek','maxSicaklik','max']);
    const nmin=val(r,['enDusukNemGun'+n,'enDusukNem','minNem']);
    const nmax=val(r,['enYuksekNemGun'+n,'enYuksekNem','maxNem']);
    const yon=val(r,['ruzgarYonGun'+n,'ruzgarYon','ruzgarYonu']);
    const hiz=val(r,['ruzgarHizGun'+n,'ruzgarHiz','ruzgarHizi']);
    const code=String(had||'').replace(/[^A-Za-z0-9_-]/g,'');
    const icon=code&&code!=='—'?'<img class="weatherIcon" alt="" src="https://www.mgm.gov.tr/Images_Sys/hadiseler/'+encodeURIComponent(code)+'.svg">':'';
    return '<tr><td>'+weatherEsc(dateText)+'</td><td>'+icon+'<strong>'+weatherEsc(weatherName(had))+'</strong><br><small>'+weatherEsc(had)+'</small></td><td class="weatherTempMin">'+weatherEsc(min)+'</td><td class="weatherTempMax">'+weatherEsc(max)+'</td><td>'+weatherEsc(nmin)+'</td><td>'+weatherEsc(nmax)+'</td><td>'+weatherEsc(yon)+'</td><td>'+weatherEsc(hiz)+'</td></tr>';
  }).join('');

  box.innerHTML='<div class="weatherPanel"><div class="weatherTitle">5 Günlük Hava Tahmini</div><div class="weatherSub">'+weatherEsc(ilce+' / '+il)+' • Meteoroloji Genel Müdürlüğü</div>'+todayCard+notice+'<div class="weatherScroll"><table class="weatherTable"><thead><tr><th rowspan="2">Tarih</th><th rowspan="2">Hadise</th><th colspan="2">Sıcaklık (°C)</th><th colspan="2">Nem (%)</th><th colspan="2">Rüzgâr (km/sa)</th></tr><tr><th>En Düşük</th><th>En Yüksek</th><th>En Düşük</th><th>En Yüksek</th><th>Yön</th><th>Hız</th></tr></thead><tbody>'+body+'</tbody></table></div><div class="weatherMobileCards">'+rows.slice(0,5).map((r,i)=>{const n=i+1;const raw=String(val(r,['tarih','date','tarihGun'+n]));const dt=raw.slice(0,10);const d=/^\d{4}-\d{2}-\d{2}$/.test(dt)?dt.split('-').reverse().join('.'):raw;const had=val(r,['hadise','hadiseKodu','weather','hadiseGun'+n,'hadise'+n]);const code=String(had||'').replace(/[^A-Za-z0-9_-]/g,'');const icon=code&&code!=='—'?'<img alt="" src="https://www.mgm.gov.tr/Images_Sys/hadiseler/'+encodeURIComponent(code)+'.svg">':'';const min=val(r,['enDusukGun'+n,'enDusuk','minSicaklik','min']);const max=val(r,['enYuksekGun'+n,'enYuksek','maxSicaklik','max']);const nemMin=val(r,['enDusukNemGun'+n,'enDusukNem','minNem']);const nemMax=val(r,['enYuksekNemGun'+n,'enYuksekNem','maxNem']);const hiz=val(r,['ruzgarHizGun'+n,'ruzgarHiz','ruzgarHizi']);return '<div class="weatherDayCard"><div class="weatherDayTop"><div class="weatherDayDate">'+weatherEsc(d)+'</div><div class="weatherDayCondition">'+icon+'<div>'+weatherEsc(weatherName(had))+'</div></div></div><div class="weatherDayStats"><div class="weatherDayStat"><span>Sıcaklık</span><b>'+weatherEsc(min)+'° / '+weatherEsc(max)+'°</b></div><div class="weatherDayStat"><span>Nem</span><b>%'+weatherEsc(nemMin)+'–%'+weatherEsc(nemMax)+'</b></div><div class="weatherDayStat"><span>Rüzgâr</span><b>'+weatherEsc(hiz)+' km/sa</b></div></div></div>'}).join('')+'</div></div>';
 }catch(e){
  if(req===weatherRequestNo){
   box.innerHTML='<div class="weatherPanel"><div class="weatherTitle">5 Günlük Hava Tahmini</div><div class="weatherSub">'+weatherEsc(ilce+' / '+il)+'</div><div class="weatherFallback">MGM hava verisi alınamadı. Dağıtım günü ve operasyon sorgusu çalışmaya devam ediyor.</div></div>';
  }
 }
}
const OPS_API='https://dagitimuyari.egemenduman.workers.dev';
let opsRequestNo=0;
function opsEsc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function hideOperationalAlerts(){const b=document.getElementById('opsBox');if(b){b.style.display='none';b.innerHTML=''}}
async function loadOperationalAlerts(il,ilce){
 const box=document.getElementById('opsBox');if(!box||!il)return;const req=++opsRequestNo;
 box.style.display='block';box.innerHTML='<div class="opsPanel opsNeutral"><div class="opsTitle">Operasyon Durumu</div><div class="opsText">Resmî kaynak uyarıları kontrol ediliyor…</div></div>';
 const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),7000);
 try{
  const r=await fetch(OPS_API+'/?il='+encodeURIComponent(il)+'&ilce='+encodeURIComponent(ilce||''),{signal:ctrl.signal,cache:'no-store'});
  if(!r.ok)throw new Error();const data=await r.json();if(req!==opsRequestNo)return;
  const a=Array.isArray(data.alerts)?data.alerts:[];
  if(!a.length){box.innerHTML='<div class="opsPanel opsOk"><div class="opsTitle">✓ Aktif operasyon uyarısı bulunamadı</div><div class="opsText">'+opsEsc(ilce?ilce+' / '+il:il)+' için eşleşen güncel uyarı bulunmadı.</div></div>';return}
  const severe=a.some(x=>x.type==='MOTOSIKLET_YASAGI'||x.type==='YOL_KAPALI');
  const items=a.slice(0,6).map(x=>'<div class="opsItem"><b>'+opsEsc(x.title||x.label||x.type||'Operasyon uyarısı')+'</b>'+(x.summary?'<div>'+opsEsc(x.summary)+'</div>':'')+(x.url?'<a class="opsLink" target="_blank" rel="noopener noreferrer" href="'+opsEsc(x.url)+'">Resmî kaynağı aç ↗</a>':'')+'</div>').join('');
  box.innerHTML='<div class="opsPanel '+(severe?'opsDanger':'opsWarn')+'"><div class="opsTitle">⚠ Operasyon uyarısı</div><div class="opsText">'+items+'</div></div>';
 }catch(e){if(req===opsRequestNo)box.innerHTML='<div class="opsPanel opsOk"><div class="opsTitle">✓ Kurye saha kısıtlaması bulunamadı</div><div class="opsText">Kontrol süresi içinde kurye/motosiklet saha çalışmasını kısıtlayan aktif bir duyuru tespit edilmedi.</div></div>'}finally{clearTimeout(timer)}
}

let DATA=[]; const DN=['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];
function norm(s){return (s||'').toLocaleLowerCase('tr-TR').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\b(mahallesi|mahalle|mah|mh|sokagi|sokak|sk|caddesi|cadde|cd)\b\.?/g,' ').replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim()}
let IDX=[]; function rebuildIndex(){IDX=DATA.map((r,i)=>({i,n:[norm(r[0]),norm(r[1]),norm(r[2])],all:norm(r[0]+' '+r[1]+' '+r[2])}));} rebuildIndex();
function hasPhrase(q,v){return !!v && (' '+q+' ').includes(' '+v+' ')}
function allTokens(q,v){const toks=v.split(' ').filter(t=>t.length>1); return toks.length>0 && toks.every(t=>(' '+q+' ').includes(' '+t+' '))}
function tokens(s){return new Set(s.split(' ').filter(Boolean))}
function fieldHit(q,v){if(!v)return false; const qt=tokens(q), vt=v.split(' ').filter(Boolean); return vt.length>0 && vt.every(t=>qt.has(t))}
function score(x,q){
  const il=x.n[0], ilce=x.n[1], mah=x.n[2];
  const ilHit=fieldHit(q,il), ilceHit=fieldHit(q,ilce), mahHit=fieldHit(q,mah);
  if(!mahHit && !ilceHit && !ilHit) return 0;
  let s=mahHit?3000:0; if(ilceHit)s+=1500; if(ilHit)s+=800;
  if(mahHit&&ilceHit)s+=2500; if(mahHit&&ilceHit&&ilHit)s+=4000;
  // Sorguda bir il/ilçe açıkça tespit edildiyse yanlış coğrafyayı ele.
  const detectedIls=new Set(IDX.filter(y=>fieldHit(q,y.n[0])).map(y=>y.n[0]));
  const detectedIlceler=new Set(IDX.filter(y=>fieldHit(q,y.n[1])).map(y=>y.n[1]));
  if(detectedIls.size && !ilHit) s-=5000;
  if(detectedIlceler.size && !ilceHit) s-=4000;
  return s;
}
function nextOpen(days,date){let d=new Date(date+'T12:00:00'); for(let add=0;add<14;add++){let x=new Date(d);x.setDate(d.getDate()+add);let idx=(x.getDay()+6)%7;if(days[idx])return {add,date:x,idx}}return null}
function fmt(d){return d.toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderRows(indices){const date=document.getElementById('date').value,box=document.getElementById('results');if(!indices.length){box.innerHTML='<div class="empty">Eşleşen mahalle bulunamadı.</div>';hideOperationalAlerts();return}box.innerHTML=indices.slice(0,30).map(i=>{const r=DATA[i],n=nextOpen(r[3],date),badge=n?(n.add===0?'Bugün dağıtım var':n.add+' gün sonra'):'Dağıtım günü yok';return `<div class="result"><div class="top"><div><div class="place">${esc(r[2])}</div><div class="small">${esc(r[1])} / ${esc(r[0])}</div></div><div class="badge ${n?'':'closed'}">${badge}</div></div>${n?`<div class="small"><b>İlk uygun gün:</b> ${fmt(n.date)}</div>`:''}<div class="days">${DN.map((d,j)=>`<span class="day ${r[3][j]?'on':''}">${d.slice(0,3)}</span>`).join('')}</div></div>`}).join('');const first=DATA[indices[0]];if(first){loadOperationalAlerts(first[0],first[1]);loadWeather(first[0],first[1]);}}
function filteredIndices(){const il=document.getElementById('il').value,ic=document.getElementById('ilce').value,m=document.getElementById('mah').value;return DATA.map((r,i)=>[r,i]).filter(([r])=>(!il||r[0]===il)&&(!ic||r[1]===ic)&&(!m||r[2]===m)).map(x=>x[1])}
function run(){const raw=document.getElementById('q').value.trim(),q=norm(raw);if(!q){renderRows(filteredIndices());return}let hits=IDX.map(x=>[score(x,q),x.i]).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]);const il=document.getElementById('il').value,ic=document.getElementById('ilce').value,m=document.getElementById('mah').value;hits=hits.filter(([s,i])=>(!il||DATA[i][0]===il)&&(!ic||DATA[i][1]===ic)&&(!m||DATA[i][2]===m));const top=hits.length?hits[0][0]:0;renderRows(hits.filter(x=>x[0]>=Math.max(1,top-250)).slice(0,30).map(x=>x[1]))}
function uniq(a){return [...new Set(a)].sort((a,b)=>a.localeCompare(b,'tr'))}
function fillSelect(el,items,placeholder){el.innerHTML=`<option value="">${placeholder}</option>`+items.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');el.disabled=!items.length}
function initFilters(){const il=document.getElementById('il'),ic=document.getElementById('ilce'),m=document.getElementById('mah');fillSelect(il,uniq(DATA.map(r=>r[0])),'Tüm iller');il.disabled=false;il.onchange=()=>{fillSelect(ic,uniq(DATA.filter(r=>!il.value||r[0]===il.value).map(r=>r[1])),'Tüm ilçeler');fillSelect(m,[],'Tüm mahalleler');run()};ic.onchange=()=>{fillSelect(m,uniq(DATA.filter(r=>(!il.value||r[0]===il.value)&&(!ic.value||r[1]===ic.value)).map(r=>r[2])),'Tüm mahalleler');run()};m.onchange=run}
let activeSug=-1;
function showSuggestions(){const input=document.getElementById('q'),box=document.getElementById('suggestions'),q=norm(input.value);activeSug=-1;if(q.length<3){box.style.display='none';return}const il=document.getElementById('il').value,ic=document.getElementById('ilce').value;let arr=[];for(let k=0;k<IDX.length;k++){const x=IDX[k],i=x.i;if(il&&DATA[i][0]!==il)continue;if(ic&&DATA[i][1]!==ic)continue;const mh=x.n[2];let s=0;if(mh===q)s=10000;else if(mh.startsWith(q))s=8000-q.length;else if(mh.includes(q))s=6000-mh.indexOf(q);else if(x.all.includes(q))s=3000-x.all.indexOf(q);if(s>0){arr.push([s,i]);if(arr.length>80){arr.sort((a,b)=>b[0]-a[0]);arr.length=20}}}arr.sort((a,b)=>b[0]-a[0]);arr=arr.slice(0,10);if(!arr.length){box.style.display='none';return}box.innerHTML=arr.map(([s,i])=>`<div class="suggestion" data-i="${i}"><b>${esc(DATA[i][2])}</b><span>${esc(DATA[i][1])} / ${esc(DATA[i][0])}</span></div>`).join('');box.style.display='block';box.querySelectorAll('.suggestion').forEach(el=>el.onmousedown=e=>{e.preventDefault();selectSuggestion(+el.dataset.i)})}
function selectSuggestion(i){suggestionSelected=true;const r=DATA[i],q=document.getElementById('q'),box=document.getElementById('suggestions'),il=document.getElementById('il'),ic=document.getElementById('ilce'),m=document.getElementById('mah');clearTimeout(suggestTimer);box.style.display='none';box.innerHTML='';q.value=`${r[2]}, ${r[1]}, ${r[0]}`;il.value=r[0];const ilceler=uniq(DATA.filter(x=>x[0]===r[0]).map(x=>x[1]));fillSelect(ic,ilceler,'Tüm ilçeler');ic.value=r[1];const mahalleler=uniq(DATA.filter(x=>x[0]===r[0]&&x[1]===r[1]).map(x=>x[2]));fillSelect(m,mahalleler,'Tüm mahalleler');m.value=r[2];renderRows([i]);q.blur()}
const qel=document.getElementById('q');let suggestTimer=null;let suggestionSelected=false;qel.addEventListener('input',()=>{clearTimeout(suggestTimer); const il=document.getElementById('il'),ic=document.getElementById('ilce'),m=document.getElementById('mah'); if(il.value||ic.value||m.value){il.value=''; fillSelect(ic,[],'Tüm ilçeler'); fillSelect(m,[],'Tüm mahalleler');}const box=document.getElementById('suggestions');if(suggestionSelected){suggestionSelected=false;const il=document.getElementById('il'),ic=document.getElementById('ilce'),m=document.getElementById('mah');il.value='';fillSelect(ic,[],'Tüm ilçeler');fillSelect(m,[],'Tüm mahalleler');}if(norm(qel.value).length<3){box.style.display='none';return}suggestTimer=setTimeout(showSuggestions,300)});qel.addEventListener('paste',()=>{clearTimeout(suggestTimer);document.getElementById('suggestions').style.display='none'});qel.addEventListener('keydown',e=>{const box=document.getElementById('suggestions'),els=[...box.querySelectorAll('.suggestion')];if((e.key==='ArrowDown'||e.key==='ArrowUp')&&els.length){e.preventDefault();activeSug=(activeSug+(e.key==='ArrowDown'?1:-1)+els.length)%els.length;els.forEach((x,j)=>x.classList.toggle('active',j===activeSug));els[activeSug].scrollIntoView({block:'nearest'})}else if(e.key==='Enter'){e.preventDefault();if(activeSug>=0&&els[activeSug])selectSuggestion(+els[activeSug].dataset.i);else{box.style.display='none';run()}}else if(e.key==='Escape')box.style.display='none'});document.addEventListener('click',e=>{if(!e.target.closest('.searchwrap'))document.getElementById('suggestions').style.display='none'});
document.getElementById('date').valueAsDate=new Date();document.getElementById('btn').onclick=run;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('DagitimGunuDB',1);r.onupgradeneeded=()=>r.result.createObjectStore('store');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function dbSet(k,v){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction('store','readwrite');tx.objectStore('store').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function dbGet(k){const db=await openDB();return new Promise((res,rej)=>{const r=db.transaction('store').objectStore('store').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function setInfo(msg,ok=true){const e=document.getElementById('dataInfo');e.innerHTML=`<span class="${ok?'statusOk':'statusErr'}">${esc(msg)}</span>`}
function dayOpen(v){const x=norm(String(v??''));return ['acik','açık','1','true','evet','yes','x'].includes(x)||v===1||v===true}
function parseRows(rows){if(!rows||rows.length<2)throw new Error('Excel boş veya başlık satırı bulunamadı.');const h=rows[0].map(x=>norm(String(x??'')));const find=(alts)=>h.findIndex(x=>alts.includes(x));const ci=find(['il']), cj=find(['ilce']), cm=find(['mahalle','mahalle koy','mahallekoy']);const dayAlts=[['pzt','pazartesi'],['sal','sali'],['crs','carsamba'],['prs','persembe'],['cum','cuma'],['cts','cumartesi'],['pzr','pazar']];const di=dayAlts.map(find);if(ci<0||cj<0||cm<0||di.some(x=>x<0))throw new Error('Beklenen sütunlar bulunamadı: İl, İlçe, Mahalle, PZT, SAL, CRS, PRS, CUM, CTS, PZR');const out=[];for(let n=1;n<rows.length;n++){const r=rows[n];const il=String(r[ci]??'').trim(),ilce=String(r[cj]??'').trim(),mah=String(r[cm]??'').trim();if(!il||!ilce||!mah)continue;out.push([il,ilce,mah,di.map(i=>dayOpen(r[i]))])}if(!out.length)throw new Error('Geçerli veri satırı bulunamadı.');return out}
async function importFile(file){try{setInfo('Excel okunuyor…');let rows;if(file.name.toLowerCase().endsWith('.csv')){const text=await file.text();const wb=XLSX.read(text,{type:'string'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''})}else{if(typeof XLSX==='undefined')throw new Error('Excel okuyucu yüklenemedi. İnternet bağlantısını kontrol edin veya CSV kullanın.');const buf=await file.arrayBuffer();const wb=XLSX.read(buf,{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''})}const fresh=parseRows(rows);DATA=fresh;rebuildIndex();initFilters();document.getElementById('q').value='';document.getElementById('results').innerHTML='';const meta={name:file.name,count:DATA.length,updated:new Date().toISOString()};await dbSet('data',DATA);await dbSet('meta',meta);setInfo(`${file.name} yüklendi • ${DATA.length.toLocaleString('tr-TR')} kayıt • ${new Date(meta.updated).toLocaleString('tr-TR')}`)}catch(e){setInfo('Güncelleme başarısız: '+e.message,false)}}
const DATA_API='https://dagitimveri.egemenduman.workers.dev';
let SUGGESTIONS=[];
function apiRows(j){return Array.isArray(j)?j:(Array.isArray(j?.rows)?j.rows:(Array.isArray(j?.data)?j.data:[]))}
function rowToData(x){
 if(Array.isArray(x)) return x;
 return [x.il,x.ilce,x.mahalle,[x.pazartesi,x.sali,x.carsamba,x.persembe,x.cuma,x.cumartesi,x.pazar].map(Number)];
}
async function apiJSON(path){
 const r=await fetch(DATA_API+path,{cache:'no-store'});
 const j=await r.json().catch(()=>({}));
 if(!r.ok) throw new Error(j.error||('HTTP '+r.status));
 return j;
}
async function apiList(path,key){
 const j=await apiJSON(path);
 return uniq(apiRows(j).map(x=>typeof x==='string'?x:(x[key]||x.name||x.value)).filter(Boolean));
}
async function loadProvinceList(){
 try{
   setInfo('Merkezi veriye bağlanılıyor…');
   const items=await apiList('/api/iller','il');
   fillSelect(document.getElementById('il'),items,'Tüm iller');
   document.getElementById('il').disabled=false;
   setInfo('Merkezi veri bağlantısı hazır • '+items.length+' il');
 }catch(e){ setInfo('Merkezi bağlantı kurulamadı: '+e.message,false); }
}
function renderApiRows(rows){
 DATA=rows.map(rowToData);
 rebuildIndex();
 renderRows(DATA.map((_,i)=>i));
}
async function showSuggestions(){
 const input=document.getElementById('q'),box=document.getElementById('suggestions');
 const raw=input.value.trim(); activeSug=-1;
 if(norm(raw).length<3){box.style.display='none';box.innerHTML='';return}
 try{
   const j=await apiJSON('/api/ara?q='+encodeURIComponent(raw));
   SUGGESTIONS=apiRows(j).slice(0,10).map(rowToData);
   if(!SUGGESTIONS.length){box.style.display='none';box.innerHTML='';return}
   box.innerHTML=SUGGESTIONS.map((r,i)=>`<div class="suggestion" data-i="${i}"><b>${esc(r[2])}</b><span>${esc(r[1])} / ${esc(r[0])}</span></div>`).join('');
   box.style.display='block';
   box.querySelectorAll('.suggestion').forEach(el=>el.onmousedown=e=>{e.preventDefault();selectSuggestion(+el.dataset.i)});
 }catch(e){box.style.display='none';}
}
async function selectSuggestion(i){
 const r=SUGGESTIONS[i]; if(!r)return;
 suggestionSelected=true; clearTimeout(suggestTimer);
 const q=document.getElementById('q'),box=document.getElementById('suggestions');
 const il=document.getElementById('il'),ic=document.getElementById('ilce'),m=document.getElementById('mah');
 box.style.display='none';box.innerHTML='';q.value=`${r[2]}, ${r[1]}, ${r[0]}`;
 il.value=r[0];
 try{
   fillSelect(ic,await apiList('/api/ilceler?il='+encodeURIComponent(r[0]),'ilce'),'Tüm ilçeler');ic.value=r[1];
   fillSelect(m,await apiList('/api/mahalleler?il='+encodeURIComponent(r[0])+'&ilce='+encodeURIComponent(r[1]),'mahalle'),'Tüm mahalleler');m.value=r[2];
 }catch(e){}
 renderApiRows([r]); q.blur();
}
async function run(){
 const q=document.getElementById('q').value.trim();
 const il=document.getElementById('il').value,ic=document.getElementById('ilce').value,m=document.getElementById('mah').value;
 const box=document.getElementById('results');
 try{
   if(il&&ic&&m){
     const j=await apiJSON('/api/mahalle?il='+encodeURIComponent(il)+'&ilce='+encodeURIComponent(ic)+'&mahalle='+encodeURIComponent(m));
     renderApiRows(j.row?[j.row]:apiRows(j)); return;
   }
   if(norm(q).length>=3){
     box.innerHTML='<div class="loading">Adres aranıyor…</div>';
     const j=await apiJSON('/api/ara?q='+encodeURIComponent(q));
     renderApiRows(apiRows(j)); return;
   }
   box.innerHTML='<div class="empty">Mahalle veya adres yazın ya da İl / İlçe / Mahalle seçin.</div>';
 }catch(e){
   box.innerHTML='<div class="error">Sorgu yapılamadı: '+esc(e.message)+'</div>';
 }
}
function initFilters(){
 const il=document.getElementById('il'),ic=document.getElementById('ilce'),m=document.getElementById('mah');
 il.onchange=async()=>{
   document.getElementById('results').innerHTML='';hideOperationalAlerts();
   const wb=document.getElementById('weatherBox');if(wb)wb.style.display='none';
   fillSelect(m,[],'Tüm mahalleler');
   if(!il.value){fillSelect(ic,[],'Tüm ilçeler');return}
   try{fillSelect(ic,await apiList('/api/ilceler?il='+encodeURIComponent(il.value),'ilce'),'Tüm ilçeler')}
   catch(e){setInfo('İlçe listesi alınamadı: '+e.message,false)}
 };
 ic.onchange=async()=>{
   document.getElementById('results').innerHTML='';hideOperationalAlerts();
   const wb=document.getElementById('weatherBox');if(wb)wb.style.display='none';
   if(!ic.value){fillSelect(m,[],'Tüm mahalleler');return}
   try{fillSelect(m,await apiList('/api/mahalleler?il='+encodeURIComponent(il.value)+'&ilce='+encodeURIComponent(ic.value),'mahalle'),'Tüm mahalleler')}
   catch(e){setInfo('Mahalle listesi alınamadı: '+e.message,false)}
 };
 m.onchange=()=>{if(m.value)run()};
}
document.getElementById('btn').onclick=run;
initFilters(); loadProvinceList();
</script>
<script>
(function(){
  function initCollapsibleQuery(){
    if(window.innerWidth>700) return;
    const search=document.getElementById('search') || document.querySelector('input[type="text"]');
    if(!search) return;

    // Find the main white query card containing the search field.
    let card=search.parentElement;
    while(card && card!==document.body && !(card.querySelector && card.querySelector('select') && card.querySelector('button'))){
      card=card.parentElement;
    }
    if(!card || card===document.body) return;

    // Everything before the first result card belongs to the query controls.
    const result=document.getElementById('results') || document.querySelector('.results');
    const toggle=document.createElement('button');
    toggle.type='button';
    toggle.className='queryToggle';
    toggle.setAttribute('aria-expanded','true');
    toggle.innerHTML='<span>🔎 Sorgu Alanı <span class="querySummary"></span></span><span class="qtChevron">⌃</span>';

    // Wrap only the direct children that are above the result container when possible.
    const controls=document.createElement('div');
    controls.className='queryControls';
    const children=[...card.children];
    const resultAncestor=children.find(ch=>ch===result || (ch.contains && result && ch.contains(result)));
    for(const ch of children){
      if(ch===resultAncestor) break;
      controls.appendChild(ch);
    }
    card.insertBefore(toggle, card.firstChild);
    card.insertBefore(controls, resultAncestor || null);

    function summary(){
      const il=document.getElementById('il') || document.querySelector('select');
      const selects=[...card.querySelectorAll('select')];
      const vals=selects.map(x=>x.options[x.selectedIndex]?.text).filter(x=>x && !/seç/i.test(x));
      const q=search.value.trim();
      toggle.querySelector('.querySummary').textContent=(q || vals.join(' / ')) ? '• '+(q || vals.join(' / ')) : '';
    }
    function setOpen(open){
      document.body.classList.toggle('queryCollapsed',!open);
      toggle.setAttribute('aria-expanded',open?'true':'false');
      toggle.querySelector('.qtChevron').textContent=open?'⌃':'⌄';
      summary();
      if(open) setTimeout(()=>search.focus({preventScroll:true}),50);
    }
    toggle.addEventListener('click',()=>setOpen(toggle.getAttribute('aria-expanded')!=='true'));

    // Collapse automatically after a successful user query/result is shown.
    const observer=new MutationObserver(()=>{
      const visibleResult=(document.getElementById('results') || document.querySelector('.results'));
      if(visibleResult && visibleResult.textContent.trim().length>10){
        summary();
        setOpen(false);
      }
    });
    if(result) observer.observe(result,{childList:true,subtree:true,characterData:true});

    // Also catch the Sorgula button after its handler completes.
    const btn=[...card.querySelectorAll('button')].find(b=>/sorgula/i.test(b.textContent));
    if(btn) btn.addEventListener('click',()=>setTimeout(()=>{
      const r=document.getElementById('results') || document.querySelector('.results');
      if(r && r.textContent.trim().length>10) setOpen(false);
    },250),true);

    summary();
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',initCollapsibleQuery);
  else initCollapsibleQuery();
})();
</script>
