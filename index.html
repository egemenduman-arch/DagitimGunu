<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dağıtım Günü Sorgulama</title>
<meta name="theme-color" content="#5b4cf0">

<script async src="https://www.googletagmanager.com/gtag/js?id=G-PV9GWK34V8"></script>
<script>
window.dataLayer=window.dataLayer||[];
function gtag(){dataLayer.push(arguments);}
gtag('js',new Date());
gtag('config','G-PV9GWK34V8');
</script>

<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#687386;--accent:#5b4cf0;--ok:#087f5b;--bad:#b42318;--line:#e5e9f2}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:850px;margin:42px auto;padding:0 18px}
.hero{margin-bottom:18px}.hero h1{font-size:32px;margin:0 0 8px}.hero p{color:var(--muted);margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 10px 30px #1720330d}
.grid{display:grid;grid-template-columns:1fr 190px 130px;gap:12px}
input,button{font:inherit;border-radius:12px;border:1px solid #ccd3df;padding:13px 14px}
input:focus{outline:2px solid #5b4cf033;border-color:var(--accent)}
button{background:var(--accent);color:#fff;border:0;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.hint{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.45}
.results{margin-top:18px}
.result{border:1px solid var(--line);border-radius:14px;padding:18px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.place{font-weight:750;font-size:17px;overflow-wrap:anywhere}
.badge{white-space:nowrap;background:#e8fff6;color:var(--ok);font-weight:800;padding:7px 10px;border-radius:999px}
.badge.closed{background:#fff2f2;color:var(--bad)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.day{font-size:12px;padding:7px 4px;border-radius:8px;background:#f0f2f6;color:#8a94a6;text-align:center}
.day.on{background:#e8fff6;color:var(--ok);font-weight:700}
.small{font-size:12px;color:var(--muted);margin-top:9px;line-height:1.5}
.loading,.error,.empty{text-align:center;padding:28px 10px;color:var(--muted)}
.error{color:var(--bad);background:#fff7f7;border:1px solid #ffd8d8;border-radius:12px}
.api{margin-top:14px;padding:10px 12px;border-radius:10px;background:#f8f9fc;color:var(--muted);font-size:12px}
@media(max-width:700px){
 .wrap{width:100%;max-width:none;margin:0;padding:14px 12px 28px}
 .hero{margin:8px 2px 14px}.hero h1{font-size:24px;line-height:1.15}.hero p{font-size:14px;line-height:1.45}
 .card{padding:14px;border-radius:16px}
 .grid{grid-template-columns:1fr;gap:10px}
 input,button{min-height:48px;font-size:16px;width:100%}
 .top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
 .place{font-size:16px;line-height:1.3}.badge{font-size:12px;padding:6px 8px}
 .days{gap:4px}.day{font-size:10px;padding:6px 2px}
}
</style>
</head>
<body>
<div class="wrap">
 <div class="hero">
  <h1>Dağıtım Günü Sorgulama</h1>
  <p>Açık adresi yazın; canlı çalışma bölgesi verisine göre ilk dağıtım gününü görün.</p>
 </div>
 <div class="card">
  <div class="grid">
   <input id="q" autocomplete="street-address" enterkeyhint="search" placeholder="Açık adres yazın">
   <input id="date" type="date">
   <button id="btn">Sorgula</button>
  </div>
  <div class="hint">İl, ilçe ve mahalleyi içeren mümkün olduğunca açık bir adres girin. Sonuçlar Excel yerine canlı servisten alınır.</div>
  <div id="results" class="results"></div>
 </div>
</div>

<script>
const WORK_API='https://api.optymus.tech/api/app/work-zone/work-days-by-full-address';
const SPECIAL_API='https://api.optymus.tech/api/app/special-days/special-days';
const DAY_NAMES=['PZR','PZT','SAL','ÇAR','PER','CUM','CTS'];
const DAY_LONG=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];

const q=document.getElementById('q');
const dateEl=document.getElementById('date');
const btn=document.getElementById('btn');
const results=document.getElementById('results');
dateEl.valueAsDate=new Date();

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function localKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmt(d){return d.toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}

async function getJson(url){
 const r=await fetch(url,{method:'GET',headers:{'Accept':'application/json'},cache:'no-store'});
 if(!r.ok) throw new Error('Servis HTTP '+r.status+' hatası döndürdü.');
 return r.json();
}

async function getWorkDays(address){
 // Tarayıcı GET isteğinde body kullanılamadığı için fullAddress query parametresi olarak gönderilir.
 const url=WORK_API+'?fullAddress='+encodeURIComponent(address);
 const data=await getJson(url);
 if(data && Array.isArray(data.errors) && data.errors.length){
   throw new Error(data.errors.map(x=>typeof x==='string'?x:(x.message||JSON.stringify(x))).join(' • '));
 }
 if(!data || !Array.isArray(data.days)) throw new Error('Çalışma günü servisi beklenen "days" alanını döndürmedi.');
 return [...new Set(data.days.map(Number).filter(n=>Number.isInteger(n)&&n>=0&&n<=6))];
}

async function getSpecialDays(){
 const data=await getJson(SPECIAL_API);
 if(!Array.isArray(data)) throw new Error('Özel gün servisi beklenen listeyi döndürmedi.');
 const map=new Map();
 for(const x of data){
   if(x && x.isActive===true && x.date){
     const key=String(x.date).slice(0,10);
     if(!map.has(key)) map.set(key,[]);
     map.get(key).push(x.title||'Özel gün');
   }
 }
 return map;
}

function nextDelivery(activeDays,specialMap,start){
 for(let add=0;add<60;add++){
   const d=new Date(start);
   d.setDate(start.getDate()+add);
   const day=d.getDay(); // 0=Pazar ... 6=Cumartesi
   if(activeDays.includes(day) && !specialMap.has(localKey(d))) return {date:d,add,day};
 }
 return null;
}

function render(address,days,specialMap,start){
 const n=nextDelivery(days,specialMap,start);
 const todaySpecial=specialMap.get(localKey(start));
 let badge='Dağıtım günü yok', cls='badge closed';
 if(n){badge=n.add===0?'Bugün dağıtım var':(n.add===1?'Yarın':n.add+' gün sonra');cls='badge'}
 const dayHtml=DAY_NAMES.map((name,i)=>`<div class="day ${days.includes(i)?'on':''}">${name}</div>`).join('');
 const specialText=todaySpecial?`<div class="small"><b>Seçilen tarih özel gün:</b> ${esc(todaySpecial.join(', '))}. Bu tarih dağıtım hesabında atlandı.</div>`:'';
 results.innerHTML=`<div class="result">
   <div class="top"><div><div class="place">${esc(address)}</div>
   <div class="small">Aktif çalışma günleri: ${days.length?days.map(d=>DAY_LONG[d]).join(', '):'Yok'}</div></div>
   <div class="${cls}">${esc(badge)}</div></div>
   <div class="days">${dayHtml}</div>
   ${n?`<div class="small"><b>İlk uygun dağıtım tarihi:</b> ${esc(fmt(n.date))}</div>`:'<div class="small">Önümüzdeki 60 gün içinde uygun dağıtım tarihi bulunamadı.</div>'}
   ${specialText}
   <div class="api">Veri kaynağı: canlı çalışma günleri + aktif özel günler servisleri</div>
 </div>`;
}

async function run(){
 const address=q.value.trim();
 if(address.length<5){results.innerHTML='<div class="error">Lütfen açık adres girin.</div>';return}
 const rawDate=dateEl.value;
 if(!rawDate){results.innerHTML='<div class="error">Lütfen tarih seçin.</div>';return}
 const start=new Date(rawDate+'T12:00:00');
 btn.disabled=true;btn.textContent='Sorgulanıyor…';
 results.innerHTML='<div class="loading">Canlı veriler sorgulanıyor…</div>';
 try{
   const [days,specialMap]=await Promise.all([getWorkDays(address),getSpecialDays()]);
   render(address,days,specialMap,start);
   if(typeof gtag==='function') gtag('event','delivery_search',{search_method:'live_api',success:true});
 }catch(e){
   console.error(e);
   results.innerHTML=`<div class="error"><b>Sorgulama yapılamadı.</b><br>${esc(e.message)}<div class="small">Tarayıcı API erişimini engelliyorsa (CORS), servis tarafında GitHub Pages alan adına izin verilmesi gerekir.</div></div>`;
   if(typeof gtag==='function') gtag('event','delivery_search',{search_method:'live_api',success:false});
 }finally{
   btn.disabled=false;btn.textContent='Sorgula';
 }
}
btn.onclick=run;
q.addEventListener('keydown',e=>{if(e.key==='Enter')run()});
</script>
</body>
</html>
