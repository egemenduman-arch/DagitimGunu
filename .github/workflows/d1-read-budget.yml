name: D1 read budget regression
on:
  pull_request:
    paths: ['worker/dagitimveri/**', 'tests/**', '.github/workflows/d1-read-budget.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
        working-directory: worker/dagitimveri
      - run: npm test
        working-directory: worker/dagitimveri
      - run: node --test --test-isolation=none tests/*.test.cjs
      - run: npm install --prefix /tmp/dg-browser playwright@1.56.1
      - name: Local browser fixtures only
        run: |
          if command -v google-chrome >/dev/null; then
            sudo ln -sf "$(command -v google-chrome)" /usr/bin/chromium
          else
            /tmp/dg-browser/node_modules/.bin/playwright install chromium
            CHROMIUM_BIN=$(node -e "console.log(require('/tmp/dg-browser/node_modules/playwright').chromium.executablePath())")
            sudo ln -sf "$CHROMIUM_BIN" /usr/bin/chromium
          fi
          NODE_PATH=/tmp/dg-browser/node_modules node tests/browser.cjs
